<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
<defs>
<linearGradient id="bg2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0b5563"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="fr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#10243d"/></linearGradient>
</defs>
<style>
.code{font:15px 'Fira Code',Consolas,Menlo,monospace}
.ln{font:13px 'Fira Code',Consolas,Menlo,monospace;fill:#475569;text-anchor:end;transform:translateX(12px)}
.ch{font:700 15px 'Fira Code',Consolas,Menlo,monospace}
.fl{animation:fl 4s ease-in-out infinite}
.bar{animation:gr 3s ease-out infinite alternate}
.cur{animation:bl 1s steps(1) infinite}
.lab{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
.dr{stroke-dasharray:420;animation:dw 4s ease-in-out infinite alternate}
@keyframes t0{0%,4%{transform:scaleX(0)}13%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}.k0{animation:t0 14s steps(34,end) infinite}
@keyframes t1{0%,17%{transform:scaleX(0)}26%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}.k1{animation:t1 14s steps(34,end) infinite}
@keyframes t2{0%,30%{transform:scaleX(0)}39%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}.k2{animation:t2 14s steps(34,end) infinite}
@keyframes t3{0%,43%{transform:scaleX(0)}52%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}.k3{animation:t3 14s steps(34,end) infinite}
@keyframes t4{0%,56%{transform:scaleX(0)}65%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}.k4{animation:t4 14s steps(34,end) infinite}
@keyframes t5{0%,69%{transform:scaleX(0)}78%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}.k5{animation:t5 14s steps(34,end) infinite}

@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes bl{50%{opacity:0}}
@keyframes dw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
</style>
